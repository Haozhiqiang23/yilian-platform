#写入 pyproject.toml 是记录项目依赖，保证以后换电脑或重新创建虚拟环境时知道需要安装它。
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "madp-assistant-learning"
version = "0.1.0"
description = "MADP Assistant hands-on learning project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "httpx",
    "langchain",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-redis",
    "pydantic",
    "pymilvus",
    "python-dotenv",
    "redis>=8,<9",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["app*"]
